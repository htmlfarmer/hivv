name: local-install

# Proves the "git clone https://github.com/htmlfarmer/hivv && run" path works on
# every platform we claim to support. This is the CI gate for the LOCAL-FIRST
# promise: a clone must boot with NO PostgreSQL, NO internet, and NO secrets.

on:
  push:
    branches: [main, master]
    paths:
      - 'api/**'
      - 'scripts/setup-local.*'
      # shipped files the suite reads as CONTRACTS (canaries, fixtures,
      # rescue E2E, watchdog tests) — a change to them must re-run the gate
      - 'scripts/lib/deps.sh'
      - 'scripts/health-watchdog.sh'
      - 'setup.sh'
      - 'public_html/rescue'
      - 'public_html/install-hivv.sh'
      - 'tests/**'
      - 'public_html/hivv-cli.py'
      # the relocation check and the units it documents — a change to
      # either must re-run the gate, or they rot in silence
      - 'scripts/portability/**'
      - 'public_html/*.service'
      - 'docs/RELOCATING.md'
      - 'docs/DUAL-CENTRE.md'
      # a change to this file must re-run the gate it defines
      - '.github/workflows/local-install.yml'
  pull_request:
    paths:
      - 'api/**'
      - 'scripts/setup-local.*'
      - 'scripts/lib/deps.sh'
      - 'scripts/health-watchdog.sh'
      - 'setup.sh'
      - 'public_html/rescue'
      - 'public_html/install-hivv.sh'
      - 'tests/**'
      - 'scripts/portability/**'
      - 'public_html/*.service'
      - 'docs/RELOCATING.md'
      - 'docs/DUAL-CENTRE.md'
      - '.github/workflows/local-install.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-install:
    name: clone-and-run (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: api/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install API dependencies
        working-directory: api
        run: |
          if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi

      - name: Clone-and-run test (no database, no internet)
        run: python tests/local_install/test_local_install.py --skip-install

      - name: Setup script --check (validates without changing the system)
        if: runner.os != 'Windows'
        run: ./scripts/setup-local.sh --check

      - name: Setup script --check (PowerShell)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/setup-local.ps1 -Check

      # The relocation check must run on a machine with NO bee state at
      # all — that is what a fresh clone looks like, and it is the case
      # that matters. On such a machine it has to REPORT THE ABSENCE
      # honestly rather than pass quietly.
      - name: Relocation check reports the absent state honestly
        if: runner.os != 'Windows'
        run: |
          set +e
          ./scripts/portability/node-state.sh --check > node-state.txt 2>&1
          code=$?
          set -e
          cat node-state.txt
          # A clean runner has no bee, so the check MUST fail.
          if [ "$code" -eq 0 ]; then
            echo "::error::node-state.sh passed on a machine with no bee state"
            exit 1
          fi
          # ...and it must say what is missing.
          if ! grep -q 'absent' node-state.txt; then
            echo "::error::node-state.sh did not report the absent state"
            exit 1
          fi
          echo "node-state.sh reported the absent state honestly (exit $code)"

      - name: Relocation check emits valid JSON
        if: runner.os != 'Windows'
        run: |
          ./scripts/portability/node-state.sh --json > node-state.json || true
          python3 -c "import json; d=json.load(open('node-state.json')); print(len(d), 'keys')"

      - name: The dial unit is a valid systemd unit
        if: runner.os == 'Linux'
        run: |
          # systemd-analyze is the only thing that actually parses a unit.
          # A unit with a typo in it fails at boot, on the box, silently.
          sudo systemd-analyze verify public_html/hivv-dial.service || true

  unit:
    name: unit tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: api/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        working-directory: api
        run: npm ci --no-audit --no-fund
      - name: Install test runner
        # pytest is NOT part of the stdlib and setup-python gives a clean
        # interpreter — without this step `python -m pytest` dies with
        # "No module named pytest" before running a single test (it did,
        # for 6 straight runs on 2026-11-17).
        # pyyaml too: tests/test_bridge.py and tests/test_telemetry_tasks_a2a.py
        # import it, and setup-python gives a clean interpreter — so without
        # this the run dies at COLLECTION with "No module named 'yaml'"
        # before a single assertion is reached (it did, on every push to
        # main, for 3 straight runs on 2026-11-25).
        run: python -m pip install --quiet pytest pyyaml
      - name: Node tests
        working-directory: api
        run: node --test
      - name: Python tests
        # Only tests/test_upgrade_review.py is pytest-shaped; the other
        # tests/*.py files are standalone scripts (main() guards), and
        # tests/local_install is a gateway harness driven by its own job.
        run: python -m pytest tests/ -q
