name: local-install

# Proves the "git clone https://github.com/htmlfarmer/hivv && run" path works on
# every platform we claim to support. This is the CI gate for the LOCAL-FIRST
# promise: a clone must boot with NO PostgreSQL, NO internet, and NO secrets.

on:
  push:
    branches: [main, master]
    paths:
      - 'api/**'
      - 'scripts/setup-local.*'
      - 'tests/local_install/**'
      - 'public_html/hivv-cli.py'
  pull_request:
    paths:
      - 'api/**'
      - 'scripts/setup-local.*'
      - 'tests/local_install/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-install:
    name: clone-and-run (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: api/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install API dependencies
        working-directory: api
        run: |
          if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi

      - name: Clone-and-run test (no database, no internet)
        run: python tests/local_install/test_local_install.py --skip-install

      - name: Setup script --check (validates without changing the system)
        if: runner.os != 'Windows'
        run: ./scripts/setup-local.sh --check

      - name: Setup script --check (PowerShell)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/setup-local.ps1 -Check

  unit:
    name: unit tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: api/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        working-directory: api
        run: npm ci --no-audit --no-fund
      - name: Node tests
        working-directory: api
        run: node --test
      - name: Python tests
        run: python -m pytest tests/ -q
